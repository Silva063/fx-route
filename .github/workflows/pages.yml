# Сборка PWA и деплой на GitHub Pages — только при изменении кода.
# Курсы приложение читает во время работы из ветки `data`:
#   https://raw.githubusercontent.com/<owner>/<repo>/data/rates.json
# (CORS открыт, CDN кеширует до 5 минут), поэтому их обновление пересборки не требует.
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_RATES_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/rates.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
