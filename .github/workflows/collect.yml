# Дополнительный сбор курсов по расписанию (основной — ПК). Результат объединяется
# с опубликованными курсами (для каждого курса — самый свежий) и пушится в ветку data.
name: Collect
on:
  schedule:
    # 08:10, 12:10, 17:10 по Кишинёву (UTC+3 летом). Банки обновляют курсы 1–3 раза в день.
    - cron: '10 5,9,14 * * *'
  workflow_dispatch:
# Push в ветку data со стандартным GITHUB_TOKEN других workflow не запускает — и не нужно:
# PWA читает rates.json из ветки data во время работы.
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Предыдущие курсы из ветки data
        run: |
          mkdir -p data
          git fetch --depth=1 origin data && git show FETCH_HEAD:rates.json > data/rates.json || echo "ветки data нет"
      - run: npm run collect -- --runner github-actions
      - name: Публикация в ветку data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run publish-data
